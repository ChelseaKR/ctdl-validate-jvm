name: next-release parity

# Non-gating, and temporary. Compares this port, byte for byte over both parity
# corpora, with ChelseaKR/ctdl-validate at the unreleased commit
# parity/reference-main-commit.txt names -- the rule set checks 6 to 9 were
# ported from (#40). ADR 0004 keeps that work off main until the reference
# releases it; this is the evidence it is right before then.
#
# Delete this workflow, the harness and the commit file together when the pin
# reaches a release carrying these rules: from then on parity/expected/ is this
# comparison, and a second copy of a gate is a second gate to keep in step.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  compare:
    name: parity against the reference's unreleased main (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One line in one file holds the commit, so the job and the harness
      # cannot compare against two different ones.
      - name: Read the pinned reference commit
        id: pin
        run: |
          set -eu
          count="$(grep -cE '^[0-9a-f]{40}$' parity/reference-main-commit.txt)"
          if [ "${count}" -ne 1 ]; then
            echo "parity/reference-main-commit.txt names ${count} commits; exactly one is required" >&2
            exit 1
          fi
          echo "sha=$(grep -E '^[0-9a-f]{40}$' parity/reference-main-commit.txt)" >> "${GITHUB_OUTPUT}"

      - name: Check out the reference at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChelseaKR/ctdl-validate
          ref: ${{ steps.pin.outputs.sha }}
          path: reference
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Build the port
        run: ./gradlew --no-daemon installDist

      - name: Prove the harness can fail
        run: python3 tools/next_release_parity.py --self-check

      - name: Compare with the reference at the pinned commit
        run: python3 tools/next_release_parity.py --reference reference
