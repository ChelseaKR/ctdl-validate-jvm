# Full-history secret scan across the whole commit history, over every result
# tier TruffleHog reports, which a diff-scoped scan by construction cannot do:
# a secret introduced and later removed in the same pull request still shows up
# in history.
name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 0" # weekly, Sunday, staggered off ci.yml
  workflow_dispatch:

permissions:
  contents: read

# A push to main falls through to the second operand, so keying it on
# `github.ref` put every commit on main into one group `...-refs/heads/main`.
# Two pushes landing close together then cancelled the older run, and that
# commit stayed on main with no verdict: a cancelled run reports `cancelled`,
# not a failure, so nothing goes red and nobody is told it went unchecked.
# `github.sha` gives each commit its own group. Pull requests are unaffected --
# they still key on the PR number and still collapse to one run.
concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: full-history secret scan (all result tiers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full clone; this is a whole-history scan, not a diff
          persist-credentials: false
      - name: TruffleHog (full history, all result tiers)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # `base: ""` + `head: HEAD` is what makes this a history scan. Without
          # them the action falls through to its own event logic and scans a
          # DIFF, not the history, while still reporting under the job name
          # "full-history secret scan (all result tiers)":
          #
          #   push              --since-commit <event.before> --branch <event.after>
          #   pull_request      --since-commit <pr.base.sha>  --branch <pr.head.sha>
          #   schedule/dispatch --since-commit ''             --branch ''   (all of it)
          #
          # So only the weekly cron and a manual dispatch ever read history; the
          # push and pull_request runs -- the ones that gate a merge -- read the
          # event's diff. Measured on this repository on 2026-09-13, same day,
          # same pinned scanner 3.97.1:
          #
          #   schedule     run 34749661266  chunks: 855  bytes: 2475409
          #   pull_request run 34767716190  chunks: 2    bytes: 1325
          #   push (main)  run 34553198678  chunks: 5    bytes: 5024
          #
          # `fetch-depth: 0` above did not prevent that and cannot: it decides
          # how much history is on DISK. All 41 commits were on disk in every
          # one of those runs. What the scanner READS is decided by how it is
          # invoked, which is these two inputs.
          #
          # `head` must be NON-EMPTY. The action's guard is
          # `if [ -n "$BASE" ] || [ -n "$HEAD" ]`, so `base: ""` on its own
          # leaves both empty and falls straight back to the event logic.
          # With `head` set the guard is taken, base_commit is "" and
          # head_commit is HEAD -- they differ, so the "BASE and HEAD commits
          # are the same" bail-out does not fire -- and the run becomes
          # `--since-commit '' --branch HEAD`, the whole history, on EVERY
          # event. `HEAD` rather than a branch name because a pull_request
          # checkout is a detached merge ref with no branch to name.
          base: ""
          head: HEAD
          # Pinned, and it must equal the version comment on the `uses` line
          # above. The action's `version:` input defaults to "latest" and it
          # runs `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so the SHA
          # pin above pins only the wrapper, not the binary that scans. Without
          # this input the sweep silently tracked whatever upstream published
          # last, and every Dependabot bump of the ref was a no-op because
          # Dependabot never edits a `with:` input.
          version: "3.97.4"
          # The action's baked-in command already passes --fail; repeating it
          # is a CLI error ("flag 'fail' cannot be repeated").
          #
          # Lob is excluded because its detector matches test identifiers across
          # this portfolio: a Lob key is `test_` or `live_` followed by
          # alphanumerics, which is also the shape of ordinary test names and
          # fixture identifiers. Lob's verifier confirms them because a
          # malformed key and an unauthorized key are indistinguishable in its
          # response, so the finding comes back VERIFIED and the scan fails on
          # nothing. There is no Lob integration here and no direct-mail
          # dependency in build.gradle.kts, so the detector can only ever
          # produce noise. Scoped to the one detector on purpose: excluding
          # test paths instead would blind the scan to real secrets in
          # fixtures, which is where they most often hide.
          # The tier list is load-bearing. `--only-verified` reports a finding
          # only when TruffleHog asked the provider and the provider said the
          # credential is live. A credential that leaked and was then REVOKED --
          # the normal end state of a real incident, and the exact case a
          # scheduled full-history sweep exists to catch -- answers "no", which
          # TruffleHog files under `unverified`. So the setting this job ran
          # with until 2026-09-06 could not fail on the thing it exists for.
          #
          # Measured 2026-09-06 on a throwaway clone with a real-shaped AWS key
          # planted in one commit and deleted in the next (confirmed present in
          # history and absent at HEAD first, or the test measures a diff scan):
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # This repository's whole history was re-scanned under the widened
          # tier on 2026-09-06 with trufflehog 3.97.1 and reported nothing, so
          # widening costs no false positives here. If a placeholder fixture
          # ever does fire, exclude that DETECTOR by name -- as Lob is excluded
          # below -- and never narrow the tier back.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob
