name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The same target a contributor runs locally: compile, formatter,
      # static analysis, tests including the cross-language parity suite,
      # and the coverage gate. Green locally means green here.
      - name: Run the verification gate
        run: ./gradlew --no-daemon verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/spotbugs
            build/reports/jacoco
          retention-days: 7
          if-no-files-found: ignore

  parity:
    name: parity against the reference implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      # This is the job that keeps parity/expected/ honest. Without it the
      # committed expectations would be nothing but a record of what this Java
      # implementation did on the day they were written, and the parity suite
      # would be comparing the port against itself. Installing the pinned
      # reference release and regenerating them proves they are still what
      # ChelseaKR/ctdl-validate actually produces.
      - name: Install the pinned reference implementation
        run: python -m pip install --require-hashes -r parity/reference-requirements.txt

      - name: Regenerate the expectations and fail on any drift
        run: |
          python3 tools/generate_expectations.py
          git --no-pager diff --exit-code -- parity/expected
