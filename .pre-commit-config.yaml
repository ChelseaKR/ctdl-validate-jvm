# Fast local hooks, run before a commit reaches CI. CI is still the gate of
# record: `./gradlew verify` in .github/workflows/ci.yml decides whether a change
# merges, and nothing here can make a red build green. These hooks only catch the
# cheap problems on your machine.
#
# Revisions are pinned to full commit SHAs with the tag in a trailing comment,
# matching how this repository pins GitHub Actions. Bump them deliberately, in a
# reviewed change.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # Formatting is google-java-format through Spotless, the same check the gate
  # runs. It goes through the wrapper rather than a mirrored formatter binary so
  # there is exactly one definition of what formatted means. `spotlessApply`
  # fixes what this reports.
  - repo: local
    hooks:
      - id: spotless-check
        name: spotlessCheck (google-java-format)
        entry: ./gradlew --no-daemon spotlessCheck
        language: system
        files: \.java$
        pass_filenames: false

      # Compile, static analysis, tests including the cross-language parity
      # suite, and the coverage gate. Too slow for the inner commit loop, so it
      # runs at pre-push, where it is the last thing before CI sees the branch.
      - id: gradle-verify
        name: ./gradlew verify
        entry: ./gradlew --no-daemon verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
